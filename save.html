<!doctype html><meta charset="utf-8"><title>Round2 save</title><meta name="robots" content="noindex">
<script>
/* Round2 "SAVE FOUND" (owner, 12 Nov): book.round2.sg tells this hidden page which booking the guest just opened, and it keeps it
   on this phone, where the homepage (same address, same phone) can read it. Nothing leaves the phone. Only book.round2.sg may write. */
addEventListener('message', function (e) {
  if (e.origin !== 'https://book.round2.sg' || !e.data || e.data.r2 !== 'save') return;
  try {
    var all = JSON.parse(localStorage.getItem('r2.saves') || '{}'), s = e.data.save, now = Date.now();
    if (s && /^R2B[A-Z0-9]{6,12}$/.test(s.ref)) { if (s.gone) delete all[s.ref]; else { s.t = now; all[s.ref] = s; } }
    for (var k in all) if (!all[k].endMs || all[k].endMs < now - 6 * 3600e3) delete all[k];
    localStorage.setItem('r2.saves', JSON.stringify(all));
  } catch (x) {}
});
</script>
