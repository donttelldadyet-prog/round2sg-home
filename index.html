<title>Round2</title>

<style>
html,body{margin:0;height:100%;background:#06050a;overflow:hidden}
#r2-stage{position:relative}
.r2-desktop #r2-stage{position:absolute;left:50%;top:50%;width:1440px;height:900px;transform-origin:50% 50%}
.r2-mobile body{overflow-x:hidden;overflow-y:auto}
.r2-mobile #r2-stage{max-width:480px;margin:0 auto}
@media (min-width:500px){.r2-mobile body{background:radial-gradient(120% 80% at 50% 40%,#140f22 0%,#06050a 70%)}.r2-mobile #r2-stage{box-shadow:0 0 0 1px rgba(244,241,251,.08),0 0 80px rgba(0,0,0,.8)}}
canvas.r2-char{display:block}
:root{--r2-inside-hue:0deg;--r2-accent:#F2C21B}
[data-inside]{filter:hue-rotate(var(--r2-inside-hue))}
/* PLAYER 1 · READY: little arcade-screen flicker (owner 18 Nov) */
.r2-p1{animation:r2p1 3.2s steps(1,end) infinite}
@keyframes r2p1{0%,84%,100%{opacity:1}86%{opacity:.25}88%{opacity:1}90%{opacity:.55}91%{opacity:1}}
@media (prefers-reduced-motion:reduce){.r2-p1{animation:none}}
/* Character select: the picked tile pulses with a soft glow in its own character colour (owner 19 Nov) */
.r2-tile:not([aria-pressed="true"]) img{animation:r2nudge 2.6s ease-in-out 2}.r2-tile[aria-label="Vale"] img{animation-delay:1.00s}.r2-tile[aria-label="Kaeden"] img{animation-delay:1.13s}.r2-tile[aria-label="Scarlett"] img{animation-delay:1.26s}.r2-tile[aria-label="Maximillion"] img{animation-delay:1.39s}.r2-tile[aria-label="Bella"] img{animation-delay:1.52s}.r2-tile[aria-label="Kai"] img{animation-delay:1.65s}.r2-tile[aria-label="Atlas"] img{animation-delay:1.78s}@keyframes r2nudge{0%,22%,100%{filter:none;transform:none}9%{filter:brightness(1.8) saturate(1.3);transform:translateY(-3px)}}@media (prefers-reduced-motion:reduce){.r2-tile img{animation:none!important}}
.r2-tile[aria-label="Vale"]{--r2-tc:#E8436A}
.r2-tile[aria-label="Kaeden"]{--r2-tc:#4DB848}
.r2-tile[aria-label="Scarlett"]{--r2-tc:#F2C21B}
.r2-tile[aria-label="Bella"]{--r2-tc:#7A5BE0}
.r2-tile[aria-label="Kai"]{--r2-tc:#24B49A}
.r2-tile[aria-label="Atlas"]{--r2-tc:#E9E7EF}
.r2-tile[aria-label="Maximillion"]{--r2-tc:#E0402F}
.r2-tile{--r2-tg:color-mix(in srgb,var(--r2-tc) 45%,transparent);position:relative;isolation:isolate}
.r2-tile[aria-pressed="true"]::before{content:'';position:absolute;inset:6% 10%;background:var(--r2-tc);filter:blur(18px);opacity:.45;z-index:-1;pointer-events:none;animation:r2halo 3.6s ease-in-out infinite}   /* soft colour glow behind the picked tile */
@keyframes r2halo{0%,100%{opacity:.32}50%{opacity:.55}}
.r2-tile[aria-pressed="true"] img{animation:r2lit .5s ease-out,r2tile 3.6s ease-in-out .5s infinite;filter:drop-shadow(0 0 1px var(--r2-tg)) brightness(1.12) saturate(1.08)}
@keyframes r2lit{0%{filter:drop-shadow(0 0 14px var(--r2-tc)) brightness(1.7) saturate(1.2)}100%{filter:drop-shadow(0 0 1px var(--r2-tg)) brightness(1.12) saturate(1.08)}}
@keyframes r2tile{0%,100%{filter:drop-shadow(0 0 1px var(--r2-tg)) brightness(1.12) saturate(1.08)}50%{filter:drop-shadow(0 0 5px var(--r2-tg)) brightness(1.12) saturate(1.08)}}
@media (prefers-reduced-motion:reduce){.r2-tile[aria-pressed="true"]::before{animation:none}.r2-tile[aria-pressed="true"] img{animation:none;filter:drop-shadow(0 0 3px var(--r2-tg)) brightness(1.12) saturate(1.08)}}
/* GAME LIBRARY polish (owner 19 Nov): straight covers, soft shine, accent lift on tap, player tags */
#r2-stage .r2-gw .r2-gt,#r2-stage .r2-gw:nth-child(n) .r2-gt{transform:none;border-radius:6px;box-shadow:0 0 0 1px rgba(244,241,251,.14),0 10px 18px -10px rgba(0,0,0,.9)!important;transition:transform .25s cubic-bezier(.2,.8,.25,1.2),box-shadow .25s ease!important}
#r2-stage .r2-gw .r2-gt::after{content:'';position:absolute;inset:0;background:linear-gradient(155deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 38%),linear-gradient(0deg,rgba(6,5,10,.35) 0%,rgba(6,5,10,0) 30%);pointer-events:none}
#r2-stage .r2-gw:hover .r2-gt,#r2-stage .r2-gw:active .r2-gt{transform:translateY(-4px) scale(1.03);transform-origin:50% 100%;box-shadow:0 0 0 1.5px var(--r2-accent),0 14px 24px -8px color-mix(in srgb,var(--r2-accent) 55%,transparent)!important}
#r2-stage .r2-gw>div:last-child>span{display:inline-block;padding:2px 8px;border:1px solid rgba(244,241,251,.16);border-radius:999px;background:rgba(244,241,251,.05);font-size:11px;color:#d6d0e3}
/* GAME PREVIEW card (owner 19 Nov): tap any game in the Loadout library */
#r2-stage .r2-gw{cursor:pointer}
#r2-gp{position:fixed;inset:0;z-index:9999;display:flex;align-items:flex-end;justify-content:center;background:rgba(6,5,10,0);transition:background .25s ease;font-family:'Chakra Petch',system-ui,sans-serif}
#r2-gp[hidden]{display:none}
#r2-gp.on{background:rgba(6,5,10,.72)}
#r2-gp .sh{position:relative;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:#0f0d18;border-top:2px solid var(--r2-accent);padding:18px 18px calc(20px + env(safe-area-inset-bottom));color:#f4f1fb;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.25,1);box-shadow:0 -20px 40px -10px color-mix(in srgb,var(--r2-accent) 30%,transparent)}
#r2-gp.on .sh{transform:none}
#r2-gp .grab{width:44px;height:4px;border-radius:2px;background:rgba(244,241,251,.25);margin:-6px auto 14px}
#r2-gp .x{position:absolute;right:12px;top:12px;width:38px;height:38px;border:1px solid rgba(244,241,251,.3);background:transparent;color:#f4f1fb;font-size:18px;cursor:pointer}
#r2-gp .top{display:flex;gap:16px;align-items:flex-start}
#r2-gp .cov{flex:none;overflow:hidden;border-radius:8px;box-shadow:0 0 0 1px rgba(244,241,251,.16),0 14px 28px -10px color-mix(in srgb,var(--r2-accent) 55%,transparent)}
#r2-gp .cov>div{transform-origin:0 0}
#r2-gp .kind{font:8px/1 'Press Start 2P',monospace;letter-spacing:.14em;color:var(--r2-accent);margin:4px 0 8px}
#r2-gp h3{margin:0 40px 8px 0;font-size:21px;line-height:1.15;font-weight:700}
#r2-gp .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
#r2-gp .tags span{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--r2-accent) 16%,transparent);border:1px solid color-mix(in srgb,var(--r2-accent) 45%,transparent);color:#f4f1fb}
#r2-gp .pl{font-size:13px;color:#d6d0e3}
#r2-gp .d{font-size:14px;line-height:1.5;color:#d6d0e3;margin:10px 0 0}
#r2-gp .top{margin-bottom:16px}
#r2-gp .rooms{display:flex;gap:6px;margin-bottom:16px}
#r2-gp .rooms span{flex:1;text-align:center;font-size:11px;font-weight:700;letter-spacing:.08em;padding:7px 4px;border:1px solid rgba(244,241,251,.14);color:rgba(244,241,251,.32)}
#r2-gp .rooms span.y{border-color:var(--r2-accent);color:#f4f1fb;background:color-mix(in srgb,var(--r2-accent) 12%,transparent)}
#r2-gp .rl{font:7px/1 'Press Start 2P',monospace;letter-spacing:.14em;color:#9a98a8;margin-bottom:7px}
#r2-gp .how{margin:4px 0 16px;padding:14px 14px 12px;border-radius:10px;background:linear-gradient(160deg,color-mix(in srgb,var(--r2-accent) 9%,transparent),rgba(244,241,251,.02) 55%);border:1px solid rgba(244,241,251,.08)}
#r2-gp .how .rl{margin-bottom:12px}
#r2-gp .how ol{margin:0;padding:0;list-style:none;counter-reset:st;position:relative}
#r2-gp .how ol:before{content:'';position:absolute;left:11px;top:12px;bottom:12px;width:2px;background:linear-gradient(180deg,var(--r2-accent),color-mix(in srgb,var(--r2-accent) 15%,transparent));border-radius:2px}
#r2-gp .how li{counter-increment:st;position:relative;padding:2px 0 14px 38px;font-size:14px;line-height:1.5;color:#e4dff0}
#r2-gp .how li:last-child{padding-bottom:2px}
#r2-gp .how li:before{content:counter(st);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 12px/1 'Chakra Petch',sans-serif;background:#0f0d18;color:var(--r2-accent);border:2px solid var(--r2-accent);box-shadow:0 0 10px -2px var(--r2-accent)}
#r2-gp .how .tip{margin:12px 0 0;padding:9px 11px;border-radius:8px;background:rgba(244,241,251,.05);font-size:13px;line-height:1.45;color:#d6d0e3}
#r2-gp .how .tip b{display:inline-block;margin-right:8px;padding:2px 6px;border-radius:4px;background:var(--r2-accent);color:#0b0914;font:8px/1.4 'Press Start 2P',monospace;letter-spacing:.08em;vertical-align:1px}
#r2-gp .how .tip[hidden]{display:none}
#r2-gp .how[hidden],#r2-gp .go[hidden],#r2-gp .rw[hidden]{display:none}
#r2-gp .go{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;background:var(--r2-accent);color:#0b0914;font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
@media (prefers-reduced-motion:reduce){#r2-gp,#r2-gp .sh{transition:none}}
/* ABOUT US as an RPG cutscene (owner 19 Nov): the 7 characters tell the story in a game dialogue box */
.r2c{position:relative;margin:4px 0 14px;user-select:none;-webkit-user-select:none;cursor:pointer;--cc:#E8436A}
.r2c-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font:8px/1 'Press Start 2P',monospace;letter-spacing:.12em;color:#a79fbd}
.r2c-top button{font:inherit;letter-spacing:inherit;color:#f4f1fb;background:transparent;border:1px solid rgba(244,241,251,.3);padding:7px 9px;cursor:pointer}
.r2c-box{position:relative;display:flex;gap:14px;align-items:flex-start;margin-top:16px;padding:18px 14px 24px;min-height:120px;background:linear-gradient(135deg,color-mix(in srgb,var(--cc) 10%,transparent),transparent 60%),rgba(11,9,20,.96);border:2px solid var(--cc);box-shadow:0 0 0 3px #0b0914,0 0 26px -8px var(--cc);transition:border-color .4s,box-shadow .4s,background .4s}
.r2c-box:after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 1px,transparent 1px 3px)}
.r2c-pic{flex:none;width:84px;transition:transform .3s cubic-bezier(.2,.8,.25,1.4),opacity .2s;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--cc) 45%,transparent))}
.r2c-pic img{display:block;width:100%}
.r2c-pic.out{opacity:0;transform:scale(.8) translateY(6px)}
.r2c-pic.talk{animation:r2c-talk .32s ease-in-out infinite alternate}
@keyframes r2c-talk{from{transform:translateY(0) rotate(0)}to{transform:translateY(-3px) rotate(-1.5deg)}}
.r2c-say{flex:1;min-width:0}
.r2c-say .r2c-plate{position:static;display:inline-block;margin:0 0 8px}
.r2c-plate{position:absolute;left:12px;top:-12px;padding:6px 9px 5px;background:var(--cc);color:#0b0914;font:9px/1 'Press Start 2P',monospace;letter-spacing:.1em}
.r2c-plate.lt{color:#fff}
.r2c-txt{margin:0;font-size:15px;line-height:1.55;color:#f4f1fb;min-height:4.7em}
.r2c-more{position:absolute;right:12px;bottom:8px;font-size:11px;color:var(--cc);animation:r2c-b 1s steps(1,end) infinite}
.r2c-more[hidden]{display:none}
@keyframes r2c-b{50%{opacity:0}}
.r2c-dots{display:flex;gap:5px;justify-content:center;margin-top:10px}
.r2c-dots i{width:6px;height:6px;background:rgba(244,241,251,.2)}
.r2c-dots i.on{background:var(--cc)}
.r2c-top>span:last-child{display:flex;gap:6px}
.r2c-box.on{animation:r2c-on .45s cubic-bezier(.2,.8,.25,1) 1}
@keyframes r2c-on{0%{transform:scaleY(.02) scaleX(.6);filter:brightness(3)}55%{transform:scaleY(1.04) scaleX(1);filter:brightness(1.6)}100%{transform:none;filter:none}}
.r2c-box.shake{animation:r2c-shake .45s cubic-bezier(.36,.07,.19,.97) 1}
@keyframes r2c-shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px) rotate(-.4deg)}40%,60%{transform:translateX(7px) rotate(.4deg)}}
.r2c-box.flash:before{content:'';position:absolute;inset:0;background:var(--cc);opacity:0;pointer-events:none;animation:r2c-fl .5s ease-out 1;z-index:4}
@keyframes r2c-fl{0%{opacity:.55}100%{opacity:0}}
.r2c-txt .hl{font-weight:700;color:var(--cc);text-shadow:0 0 12px color-mix(in srgb,var(--cc) 45%,transparent)}
.r2c-txt.big{font-size:18px;font-weight:700}
.r2c-txt.big .hl{display:block;font-size:22px;line-height:1.2;margin-bottom:6px;text-transform:uppercase;letter-spacing:.02em}
.r2c-q{font:8px/1 'Press Start 2P',monospace;letter-spacing:.14em;color:#a79fbd;margin:2px 0 10px;text-align:left}
.r2c-menu{list-style:none;margin:0;padding:0;text-align:left}
.r2c-menu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#d6d0e3;font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;padding:9px 6px 9px 26px;cursor:pointer;position:relative}
.r2c-menu button.on{color:#0b0914;background:var(--cc)}
.r2c-menu button.on:before{content:'\25B6';position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:11px;animation:r2c-b .7s steps(1,end) infinite}
@media (prefers-reduced-motion:reduce){.r2c-box.on,.r2c-box.shake,.r2c-box.flash:before,.r2c-menu button.on:before{animation:none}}
.r2c-end{flex:1;text-align:center;padding:6px 0 2px}
.r2c-end p{margin:4px 0 16px;text-align:center;font-size:19px;line-height:1.3;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#f4f1fb}
.r2c-full{margin:6px 0 10px;border-top:1px solid rgba(244,241,251,.12);padding-top:10px}
.r2c-full summary{cursor:pointer;font:8px/1.6 'Press Start 2P',monospace;letter-spacing:.12em;color:#a79fbd;padding:6px 0}
.r2c-full p{font-size:14px!important}
@media (prefers-reduced-motion:reduce){.r2c-pic,.r2c-box{transition:none}.r2c-pic.talk,.r2c-more{animation:none}}
/* GAME LIBRARY shelves (owner 19 Nov): games grouped into mood shelves that swipe sideways */
#r2-stage .r2-scroll>div:has(>.r2-gw){display:none!important}
.r2-shelves{padding-top:12px}
.r2-shelf{margin:0 -16px 22px}
.r2-shelf h4{display:flex;align-items:baseline;gap:10px;margin:0 16px 10px;font:9px/1.2 'Press Start 2P',monospace;letter-spacing:.12em;color:var(--r2-accent)}
.r2-shelf h4 em{font:600 12px 'Chakra Petch',sans-serif;font-style:normal;letter-spacing:0;color:#a79fbd}
.r2-shelf h4 span{margin-left:auto;font:600 11px 'Chakra Petch',sans-serif;letter-spacing:.04em;color:#a79fbd}
.r2-row{display:flex;gap:13px;overflow-x:auto;scroll-snap-type:x mandatory;padding:16px 16px 12px;margin-top:-10px;scroll-padding:0 16px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.r2-row::-webkit-scrollbar{display:none}
.r2-row>.r2-gw{flex:none;scroll-snap-align:start;animation:none}
.r2-row>.r2-gw>div:nth-child(2){min-height:0!important}
/* Shelf polish (owner 19 Nov): player badge on the cover, no repeated tags, edge fade, heading line */
.r2-row>.r2-gw>div:last-child{display:none}
.r2-row>.r2-gw>div:nth-child(2){min-height:0!important;margin-top:9px!important;font-size:13px!important}
.r2-pc{position:absolute;right:6px;bottom:6px;z-index:2;display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:999px;background:rgba(11,9,20,.78);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid rgba(244,241,251,.18);font:700 10.5px/1 'Chakra Petch',sans-serif;color:#f4f1fb;letter-spacing:.02em;pointer-events:none}
.r2-pc svg{width:11px;height:11px;opacity:.85}
.r2-row{-webkit-mask-image:linear-gradient(90deg,#000 0,#000 86%,transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 86%,transparent 100%)}
.r2-shelf{margin-bottom:14px!important}
.r2-shelf h4{align-items:center!important}
.r2-shelf h4:after{content:'';flex:1;height:1px;margin-left:4px;background:linear-gradient(90deg,color-mix(in srgb,var(--r2-accent) 55%,transparent),transparent);order:1}
.r2-shelf h4 span{order:2;margin-left:8px!important}
/* Book a slot pull (owner 20 Nov): soft ring pulse + a light sweep every few seconds */
.r2-cta{position:relative;gap:10px}
.r2-cta:after{clip-path:inset(0)}
.r2-cta:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(120,110,160,.35) 48%,transparent 66%) -160% 0/250% 100% no-repeat;animation:r2ctashine 3.2s ease-in-out infinite}
.r2-cta{animation:r2ctaring 1.6s ease-out infinite}
@keyframes r2ctaring{0%{box-shadow:0 0 0 0 rgba(244,241,251,.45)}100%{box-shadow:0 0 0 12px rgba(244,241,251,0)}}
.r2-cta-go{font-size:10px;display:inline-block;animation:r2ctago 1.6s ease-in-out infinite}
@keyframes r2ctashine{0%,60%{background-position:160% 0}100%{background-position:-160% 0}}
@keyframes r2ctago{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.r2-cta,.r2-cta:after,.r2-cta-go{animation:none}}
/* Room picker hint (owner 20 Nov): until the guest taps it, the pill glows softly so it reads as tappable */
html:not(.r2-picked) #r2-stage div[role="group"]{animation:r2pillglow 1.8s ease-in-out infinite}
@keyframes r2pillglow{0%,100%{box-shadow:0 0 0 0 transparent;border-color:rgba(244,241,251,.28)}50%{box-shadow:0 0 22px 0 color-mix(in srgb,var(--r2-accent) 70%,transparent);border-color:var(--r2-accent)}}
@media (prefers-reduced-motion:reduce){html:not(.r2-picked) #r2-stage div[role="group"]{animation:none}}
/* Search (owner 20 Nov) */
.r2-srch{display:flex;align-items:center;gap:8px;margin:0 0 16px;padding:0 6px 0 14px;height:44px;border:1px solid rgba(244,241,251,.22);border-radius:999px;background:rgba(26,21,40,.9);color:#a79fbd}
.r2-srch:focus-within{border-color:var(--r2-accent)}
.r2-srch svg{width:15px;height:15px;flex:none}
.r2-srch input{flex:1;min-width:0;height:100%;border:0;background:transparent;color:#f4f1fb;font:500 16px 'Chakra Petch',sans-serif;outline:none;-webkit-appearance:none;appearance:none}
.r2-srch input::-webkit-search-cancel-button{display:none}
.r2-srch input::placeholder{color:#8d87a0}
.r2-srch button{width:32px;height:32px;border:0;border-radius:50%;background:rgba(244,241,251,.1);color:#f4f1fb;font-size:12px;cursor:pointer}
.r2-shelves.srching .r2-shelf{display:none}
.r2-res h4{margin:0 0 12px;font:9px/1.2 'Press Start 2P',monospace;letter-spacing:.12em;color:var(--r2-accent)}
.r2-res p{margin:4px 0 18px;color:#a79fbd;font-size:14px}
.r2-resg{display:flex;flex-wrap:wrap;gap:16px 13px;padding-bottom:12px}
.r2-resg>.r2-gw{flex:none;animation:none}
.r2-resg>.r2-gw>div:last-child{display:none}
.r2-where{position:absolute;left:6px;top:6px;z-index:2;padding:3px 7px;background:var(--r2-accent);color:#0b0914;font:700 10px/1.1 'Chakra Petch',sans-serif;letter-spacing:.03em;pointer-events:none;max-width:calc(100% - 12px)}
.r2-else>.r2-gt{filter:saturate(.75) brightness(.85)}
.r2-resg>.r2-gw>div:nth-child(2){min-height:0!important;margin-top:8px!important;font-size:13px!important}
</style>

<body>
<div id="r2-stage"></div>
<script>
/* ===== ROUND2 COLOURS: change these to match your LEDs ===== */
window.R2_THEME = {
  insideLed: '#ff1f2e',     // [ ] LED colour after the lobby: Loadout, How to play and Find us screens
  accent: '#F2C21B'         // UI accent (early bird, highlights, borders)

<script>
/* ===== Round2 site stats (branch site-stats) =====
   Counts what visitors do in this page and saves only numbers to the Round2 Firebase database, under /web:
   - /web/days/<YYYY-MM-DD SG>/<counter>: +1 per visit for each thing a visit did (once per visit, so they read as
     "how many visits reached this step"). Counters: visit, hNN (hour started, SG), dev_m / dev_d, entry_<screen>,
     rooms, room_<name>, gallery, loadout, how, find, info_<tab>, book, sb_<SimplyBook step>, out_<link>.
   - /web/live/<random id>: { t: server time, p: what they're looking at } every 30 s while the page is on screen,
     removed when they leave. The control centre's Website tab counts entries newer than ~75 s as "on the site now".
   No names, contact details, IPs or cookies are stored. A visit = this browser tab's session (sessionStorage).
   Turn off for a load with ?notrack (or ?sim=..., which is staff testing). Rules for /web live in the Firebase console;
   see docs in round2-tv-launcher/docs/site-stats.md. Everything is best-effort: if a write fails, the page doesn't care. */
(function () {
  'use strict';
  try {
    var q = new URLSearchParams(location.search);
    if (q.has('notrack') || q.has('sim')) return;
  } catch (e) { return; }
  var DB = 'https://round2-tv-default-rtdb.asia-southeast1.firebasedatabase.app/web';
  var ROOMS = ['vale', 'kaeden', 'scarlett', 'bella', 'kai', 'atlas', 'maximillion'];
  var MENUS = { 1: 'rooms', 2: 'loadout', 3: 'how', 4: 'find' };
  function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) { return null; } }
  function sg() { var d = new Date(Date.now() + 8 * 3600e3); return { day: d.toISOString().slice(0, 10), hour: ('0' + d.getUTCHours()).slice(-2) }; }
  var visitDay = ss('r2s.day'), first = !visitDay;
  if (first) { visitDay = sg().day; ss('r2s.day', visitDay); }
  var sid = ss('r2s.sid');
  if (!sid) { sid = Math.random().toString(36).slice(2, 12) + Date.now().toString(36).slice(-4); ss('r2s.sid', sid); }

  /* counters: batched, each once per visit */
  var pend = {}, timer = null;
  function count(k) {
    k = String(k).toLowerCase().replace(/[^a-z0-9_]/g, '_').slice(0, 32);
    if (!k || ss('r2s.c.' + k)) return;
    ss('r2s.c.' + k, '1');
    pend[k] = { '.sv': { increment: 1 } };
    clearTimeout(timer); timer = setTimeout(flush, 800);
  }
  function flush(beacon) {
    var keys = Object.keys(pend); if (!keys.length) return;
    var body = JSON.stringify(pend); pend = {};
    try { fetch(DB + '/days/' + visitDay + '.json', { method: 'PATCH', body: body, keepalive: !!beacon }).catch(function () {}); } catch (e) {}
  }

  /* what they're looking at, for the live view */
  var where = 'home';
  function live(gone) {
    try {
      if (gone) { fetch(DB + '/live/' + sid + '.json', { method: 'DELETE', keepalive: true }).catch(function () {}); return; }
      if (document.visibilityState === 'hidden') return;
      fetch(DB + '/live/' + sid + '.json', { method: 'PUT', body: JSON.stringify({ t: { '.sv': 'timestamp' }, p: where }) }).catch(function () {});
    } catch (e) {}
  }
  function at(p) { if (p !== where) { where = p; live(); } }

  /* the visit itself */
  var st = window.R2_START || {};
  var entry = st.book ? 'book' : st.info ? 'info' : MENUS[st.menu] || 'home';
  if (first) {
    count('visit'); count('h' + sg().hour);
    count(innerWidth < 760 ? 'dev_m' : 'dev_d');
    count('entry_' + entry);
  }

  /* screens: watch the page's own state changes (DCLogic is the runtime's component base) */
  var last = {}, deepRoom = st.menu === 1 && typeof st.pick === 'number' && /[?&]room=/.test(location.search);
  function seen(s) {
    if (!s) return;
    if (s.book && !last.book) { count('book'); }
    if (s.menu !== last.menu && MENUS[s.menu]) count(MENUS[s.menu]);
    /* a room counts when it was CHOSEN (owner, 15 Nov: Vale was inflated – the Rooms screen opens on Vale, so every visit to
       Rooms counted it). Arriving on Rooms counts the room shown only if it isn't the default first one (a remembered pick),
       or a ?room= link asked for it; after that every room moved to counts, Vale included. */
    if (s.menu === 1 && ROOMS[s.pick]) {
      if (last.menu === 1 ? s.pick !== last.pick : (s.pick !== 0 || deepRoom)) count('room_' + ROOMS[s.pick]);
      deepRoom = false;
    }
    if (s.gal && !last.gal) count('gallery');
    if (s.info && s.info !== last.info) count('info_' + s.info);
    last = { book: s.book, menu: s.menu, pick: s.pick, gal: s.gal, info: s.info };
    at(s.book ? 'booking' : s.info ? 'info' : MENUS[s.menu] || 'home');
  }
  if (window.DCLogic) {
    var orig = window.DCLogic.prototype.setState;
    window.DCLogic.prototype.setState = function (u) { var r = orig.apply(this, arguments); try { seen(this.state); } catch (e) {} return r; };
  }
  seen({ book: !!st.book, menu: st.menu || 0, pick: st.pick || 0, gal: false, info: st.info || null });

  /* SimplyBook form steps (it posts { event: 'stepChanged', step: 'category' | ... } to this page) */
  addEventListener('message', function (e) {
    if (!/simplybook\./.test(e.origin) || !e.data || typeof e.data !== 'object') return;
    if (e.data.event === 'stepChanged' && typeof e.data.step === 'string') { count('sb_' + e.data.step); at('booking_' + e.data.step.slice(0, 14)); }
  });

  /* links out: WhatsApp, Telegram, Instagram, TikTok, Maps, email, phone */
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest && e.target.closest('a[href]'); if (!a) return;
    var h = a.getAttribute('href') || '';
    var k = /wa\.me|whatsapp/i.test(h) ? 'wa' : /t\.me|telegram/i.test(h) ? 'tg' : /instagram/i.test(h) ? 'ig' : /tiktok/i.test(h) ? 'tiktok' :
      /maps\.|goo\.gl\/maps|maps\.app/i.test(h) ? 'maps' : /^mailto:/i.test(h) ? 'email' : /^tel:/i.test(h) ? 'phone' : /simplybook/i.test(h) ? 'simplybook' : null;
    if (k) { count('out_' + k); flush(true); }
  }, true);

  live(); setInterval(live, 30000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') live(); else flush(true); });
  addEventListener('pagehide', function () { flush(true); live(true); });
})();
</script>

var HOW={t:['Shuffle the deck and place it face down.','Take turns drawing a card and reading it out loud.','Answer honestly \u2013 there are no wrong answers. Everyone can jump in with follow-up questions.','Not feeling a card? Pass and draw another.','Tip: phones down, snacks up. The best answers come with time.'],x:['Shuffle the deck while thinking of a question or a topic.','Draw three cards and lay them face down in a row: past, present, future.','Flip them over one at a time.','Take a photo of your three cards and send it to ChatGPT, Gemini or Claude. Ask: \u201cGive me a tarot reading for these cards: past, present, future.\u201d','Read it out together and talk about what it means for you. Then swap and do a reading for each other.','Tip: just for fun \u2013 but some say it\u2019s scarily accurate \uD83D\uDC40'],'How Well Do You Know Me?':['Pick one person for the hot seat.','Draw a card and read the question out loud.','Everyone else secretly guesses how the hot seat will answer.','The hot seat answers \u2013 everyone who guessed right gets a point.','Rotate the hot seat. Most points at the end wins.'],"Monopoly Electronic Banking":["Each player gets a bank card – the banking unit starts everyone with 15M.", "Roll the dice and move around the board.", "Land on an unowned property? Buy it by tapping your card on the unit.", "Land on someone else’s property? Pay rent card-to-card. Pass GO to collect 2M.", "Own a full colour set to build houses and hotels for higher rent.", "Last player who isn’t bankrupt wins."],"Sushi Go Party!":["Pick a menu of 8 dish types and shuffle those cards together.", "Deal everyone a hand. All players secretly pick one card and reveal at the same time.", "Pass the rest of your hand to the left and pick again, until the cards run out.", "Score the round – sets, sushi rolls and combos all score differently.", "Play 3 rounds (desserts score at the end). Most points wins.", "Tip: watch what your neighbour keeps – then pass them nothing good."],"Avalon":["Deal secret roles: Loyal Servants (good) and Minions of Mordred (evil). Merlin is good and knows who’s evil.", "Eyes closed: evil players open their eyes to see each other, then Merlin sees the evil team.", "The leader picks a team for the quest. Everyone votes yes or no on the team.", "The team secretly plays Success or Fail. Just one Fail sinks the quest (with 7+ players, the 4th quest needs two – check the board).", "3 successful quests and good almost wins – but if the Assassin guesses Merlin, evil steals it.", "3 failed quests, or 5 rejected teams in a row, and evil wins."],"The Resistance":["Deal secret roles: Resistance members and a few Spies. Spies secretly learn who the other spies are.", "The leader picks a mission team. Everyone votes to approve or reject it.", "Team members secretly play Success or Fail. One Fail and the mission fails (with 7+ players, the 4th mission needs two – check the board).", "Pass the leader role clockwise and keep accusing, bluffing and voting.", "3 successful missions and the Resistance wins. 3 failed missions and the Spies win.", "Tip: the loudest accuser is not always innocent."],"Dumb Ways to Die":["Everyone takes 3 bean cards (alive side up) and 5 cards. Swap out any red-bordered card you’re dealt.", "On your turn, roll the die – that’s how many actions you get. Each action is draw a card or play a card.", "Accident! cards (Home, Nature, Ride) can be thrown at others or used to defend: Nature beats Ride, Ride beats Home, Home beats Nature. Relax cards block most attacks.", "Draw a You Died! card and you lose a life unless you can counter it. Psycho Attack! makes everyone roll – only a 1 is safe.", "Each lost life flips one of your beans to dead. Lose all 3 and you’re out.", "Last player with a living bean wins."],"Chess":["White moves first; players take turns moving one piece.", "Each piece moves its own way: pawns forward, rooks straight, bishops diagonally, knights in an L, the queen any direction, the king one square.", "Capture by moving onto an opponent’s piece.", "Attacking the king is “check” – your opponent must get out of it.", "Checkmate (the king can’t escape) wins the game."],"Codenames":["Split into two teams. Each team picks a Spymaster.", "Lay out 25 word cards in a 5×5 grid. Only the Spymasters see the secret key card.", "Spymasters take turns giving a one-word clue plus a number, e.g. “Ocean, 2”.", "Teammates tap words they think match. Wrong colour ends your turn.", "Touch the assassin card and your team loses instantly.", "First team to find all their agents wins."],"What Do You Meme?":["Deal 7 caption cards to everyone.", "The judge flips a photo card and places it in the middle.", "Everyone else plays their funniest caption face down.", "The judge reads them out and picks the winner, who keeps the photo card.", "Draw back up to 7, pass the judge role and repeat.", "Play as many rounds as you like – whoever has the most photo cards wins."],"Coup":["Each player gets 2 face-down influence cards and 2 coins.", "On your turn, take one action: Income (1 coin), Foreign Aid (2 coins) or Coup (pay 7 to make someone lose a card).", "Or claim a character – Duke takes 3 coins, Assassin pays 3 to kill, Captain steals 2, Ambassador swaps cards. You can bluff!", "Anyone can challenge a claim. Whoever is wrong loses a card.", "With 10 or more coins you must Coup.", "Lose both cards and you’re out. Last player standing wins."],"Rivals for Catan":["Each player builds their own principality of regions, roads and settlements.", "Roll the production die – regions with that number produce resources.", "Roll the event die too – it can bring trade, plague, festivals and more.", "Spend resources to build roads, settlements, cities and special cards.", "Earn victory points from buildings and advantages.", "First to the target points wins (7 in the introductory game)."],"Classic UNO":["Deal 7 cards each. Flip the top card to start the discard pile.", "On your turn, match the top card by colour, number or symbol. Can’t? Draw one card.", "Action cards: Skip, Reverse and Draw Two. Wild changes the colour; Wild Draw Four also makes the next player draw 4.", "Down to one card? Shout “UNO!” – get caught not saying it and you draw 2.", "First to empty their hand wins the round."],"UNO No Mercy":["Play like UNO – match colour, number or symbol.", "Can’t play? Keep drawing until you get a card you can play.", "Stack Draw cards on a Draw card of equal or higher value – whoever can’t stack takes the whole pile.", "Play a 7 to swap hands with anyone. Play a 0 and everyone passes their hand along.", "Mercy Rule: reach 25 cards and you’re knocked out.", "Empty your hand – or be the last one standing – to win."],"Flip 7":["The dealer deals one card face up to each player (action cards take effect right away).", "On your turn, Hit (flip another card) or Stay (bank your points for the round).", "Flip a number you already have and you bust – 0 points this round. A Second Chance card saves you once.", "Freeze stops a player; Flip Three makes them flip three cards in a row.", "Get 7 different numbers for a +15 bonus – the round ends instantly.", "Add your numbers (×2 and +bonus cards apply). First to 200 points wins."],"Monopoly Deal":["Deal 5 cards each.", "On your turn, draw 2 cards (5 if your hand is empty), then play up to 3 cards.", "Put money and action cards in your bank, lay down properties, or play actions like Rent, Sly Deal and Deal Breaker.", "Owe someone? Pay from your bank or properties – no change given.", "Just Say No cancels an action against you. End your turn with no more than 7 cards.", "First to collect 3 full property sets in different colours wins."],"Werewolf":["Pick a moderator. Everyone else secretly gets a role card – a few are Werewolves, most are Villagers.", "Night: everyone closes their eyes. Werewolves wake and silently choose a victim; special roles like the Seer wake to use their power.", "Day: the moderator reveals who was eliminated. Everyone debates who the werewolves are.", "Vote to eliminate one player. Eliminated players reveal their role and stay silent.", "Villagers win by eliminating every werewolf. Werewolves win when they equal the villagers."],"Muffin Time":["Deal 3 cards each.", "On your turn, you may first set one trap card face down (up to 3 in front of you).", "Then either play one action card (read it aloud) or draw a card.", "Counter cards can be played any time – even on someone else’s turn – to stop an action.", "Hold exactly 10 cards? Shout “IT’S MUFFIN TIME!”", "Still on 10 cards at the start of your next turn? You win."],"Exploding Kittens":["Deal 7 cards and 1 Defuse to each player. Shuffle Exploding Kittens (one fewer than the number of players) into the deck.", "On your turn, play as many cards as you like – or none.", "End your turn by drawing a card.", "Drew an Exploding Kitten? Play a Defuse and sneak the kitten back into the deck anywhere. No Defuse – you’re out.", "Nope cancels any action (except a Kitten or Defuse). Matching pairs of cat cards let you steal a random card.", "Last player who hasn’t exploded wins."],"Goat Lords":["Deal 5 cards each and flip one card to start the discard pile.", "On your turn, do one thing: give birth to a goat stack (two matching goats, or one goat + a wild), duel, play an action card, or discard and redraw.", "Your first stack is your Base Stack – it can never be stolen.", "Duel: attack another player’s top stack with matching goats. Win the duel and the stack is yours.", "Everyone refills to 5 cards at the end of each turn.", "When the cards run out, add up your goats’ points. Highest herd wins."],"Unstable Unicorns":["Each player starts with a Baby Unicorn in their Stable and 5 cards.", "Turn: trigger any start-of-turn effects, draw 1 card, then play 1 card or draw another.", "Play Unicorns into your Stable; Upgrades help you, Downgrades hurt others; Magic cards have one-time effects.", "Anyone can play a Neigh card to stop a card being played.", "End your turn with no more than 7 cards.", "First to collect 7 Unicorns in their Stable wins (6 with 6 or more players)."],"Playing Cards":["A standard 52-card deck – pick any game you know.", "Quick ideas: Big Two, Blackjack, Cheat (Bluff) or Snap.", "Not sure of the rules? Watch the video, or ask us for a favourite."],"Paper Mahjong":["Mahjong played with cards instead of tiles – best with 4 players.", "Shuffle and deal 13 cards each; the dealer takes a 14th.", "On your turn, draw a card and discard one. You can claim another player’s discard to complete a set.", "Build sets of three (a run like 1-2-3 of one suit, or three of a kind) plus one pair.", "First to complete 4 sets and a pair calls “Hu!” and wins the hand.", "Tip: use your usual house rules for scoring."],"Shadow House":["For 3–8 players. Build the deck for your player count (see the table in the rulebook) and deal 4 cards to each player – keep them secret.", "Whoever holds “First on the Scene” starts by playing it face up.", "Going clockwise, each player plays one card face up, reads it aloud and does what it says.", "Somebody is hiding the Culprit! Detectives, Toby and the handcuffs are your ways to expose them.", "The round ends when the Culprit is caught – or slips away as someone’s last card. Hand out points as the rules say.", "Play rounds until someone reaches 5 points. Highest score wins.", "Tip: bluff with a straight face – the Culprit could be anyone."]};
