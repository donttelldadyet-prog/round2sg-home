<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Round2 Picks</title>
<!--
  Round2 Picks – fortnightly Instagram movie carousel (1080 x 1350, 4:5).
  Marketing only. Nothing here is used by the live site (index.html / slots / menu / worker).
  To make a new issue: edit ISSUE below, then run  python3 render.py  (see README.md).
-->
<style>
@font-face{font-family:'Press Start 2P';src:url(fonts/PressStart2P-Regular.ttf)}
@font-face{font-family:'Chakra Petch';font-weight:500;src:url(fonts/ChakraPetch-Medium.ttf)}
@font-face{font-family:'Chakra Petch';font-weight:600;src:url(fonts/ChakraPetch-SemiBold.ttf)}
@font-face{font-family:'Chakra Petch';font-weight:700;src:url(fonts/ChakraPetch-Bold.ttf)}

:root{
  /* same tokens as www.round2.sg */
  --bg:#06050a; --panel:#0e0b17; --ink:#f4f1fb; --soft:#d6d0e3; --mute:#a79fbd;
  --line:rgba(244,241,251,.14); --accent:#F2C21B;
}
*{box-sizing:border-box}
body{margin:0;background:#1a1726;font-family:'Chakra Petch',sans-serif;color:var(--ink)}
.deck{display:flex;flex-wrap:wrap;gap:40px;padding:40px;justify-content:center}
body.render .deck{padding:0;gap:0}

/* ---------- slide frame ---------- */
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--bg);flex:none;
  --c:var(--accent); --cink:#0b0914}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;background:var(--c);filter:blur(180px);opacity:.22;pointer-events:none}
.scan{position:absolute;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 5px)}
.vign{position:absolute;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.7) 100%)}
.frame{position:absolute;inset:36px;border:1px solid var(--line);z-index:3;pointer-events:none}
.frame::before,.frame::after{content:"";position:absolute;width:34px;height:34px;border:4px solid var(--c)}
.frame::before{left:-4px;top:-4px;border-right:0;border-bottom:0}
.frame::after{right:-4px;bottom:-4px;border-left:0;border-top:0}
.px{font-family:'Press Start 2P',monospace;letter-spacing:.14em;text-transform:uppercase}
.in{position:absolute;inset:84px 84px 84px 84px;z-index:6;display:flex;flex-direction:column}

.top{display:flex;justify-content:space-between;align-items:center;font-size:17px;color:var(--mute)}
.top img{height:38px;display:block}
.dash{flex:1;height:10px;margin:0 22px;opacity:.5;
  background:repeating-linear-gradient(90deg,var(--c) 0 10px,transparent 10px 20px)}

/* ---------- cover ---------- */
.cv-kicker{margin-top:110px;font-size:22px;color:var(--accent)}
.cv-title{margin:30px 0 0;font-weight:700;font-size:190px;line-height:.88;text-transform:uppercase;letter-spacing:-.01em}
.cv-title span{display:block;color:transparent;-webkit-text-stroke:3px var(--ink)}
.cv-sub{margin-top:34px;font-size:34px;line-height:1.35;color:var(--soft);max-width:820px}
.select{margin-top:auto;border:1px solid var(--line);background:rgba(14,11,23,.75)}
.select .hd{display:flex;justify-content:space-between;padding:22px 28px;font-size:15px;color:var(--mute);border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:24px;padding:22px 28px;border-bottom:1px solid rgba(244,241,251,.08)}
.row:last-child{border-bottom:0}
.row .n{font-size:18px;color:var(--rc);width:60px}
.row .t{flex:1;font-weight:700;font-size:40px;text-transform:uppercase;line-height:1}
.row .sv{font-size:13px;padding:10px 12px;border:1px solid var(--rc);color:var(--rc)}
.row.on{background:color-mix(in srgb,var(--rc) 14%,transparent)}
.row.on .t::before{content:"▶ ";color:var(--rc);font-size:30px;vertical-align:4px}
.blink{animation:b 1.1s steps(2,start) infinite}@keyframes b{to{visibility:hidden}}
body.render .blink{animation:none}
.cv-foot{margin-top:30px;display:flex;justify-content:space-between;font-size:15px;color:var(--mute)}

/* ---------- pick ---------- */
.bgimg{position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);object-fit:cover;filter:blur(40px) saturate(1.2);opacity:.28;z-index:0}
.pk-head{margin-top:44px;display:flex;justify-content:space-between;align-items:center}
.pk-num{font-size:18px;color:var(--c)}
.badge{font-size:15px;padding:14px 16px;background:var(--c);color:var(--cink)}
.hero{margin-top:36px;display:flex;gap:44px;align-items:flex-start}
.poster{position:relative;flex:none;width:400px;height:600px;border:3px solid var(--c);
  box-shadow:14px 14px 0 color-mix(in srgb,var(--c) 45%,transparent);
  background:radial-gradient(80% 70% at 50% 60%,color-mix(in srgb,var(--c) 24%,transparent),transparent 70%),#0b0914;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.poster .ph{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:11px;color:var(--mute);line-height:1.8}
.sprite{display:grid;gap:0}
.side{flex:1;min-width:0;padding-top:6px}
.genre{font-size:14px;color:var(--c)}
.pk-title{margin:22px 0 0;font-weight:700;font-size:var(--ts,88px);line-height:.92;text-transform:uppercase;letter-spacing:-.01em;
  text-shadow:5px 5px 0 color-mix(in srgb,var(--c) 55%,transparent);overflow-wrap:anywhere}
.pk-meta{margin-top:22px;font-size:14px;color:var(--mute);line-height:1.9}
.pk-meta b{color:var(--ink);font-weight:400}
.pk-why{margin-top:22px;font-size:29px;line-height:1.35;color:var(--soft)}
.room{margin-top:auto;position:relative;padding:30px 32px 28px;border:1px solid var(--line);border-left:10px solid var(--c);background:rgba(14,11,23,.86)}
.room .l{font-size:15px;color:var(--c)}
.room .nm{margin-top:14px;font-weight:700;font-size:72px;text-transform:uppercase;line-height:.95}
.room .nm small{font-family:'Press Start 2P',monospace;font-size:14px;letter-spacing:.12em;font-weight:400;color:var(--mute);margin-left:16px;vertical-align:14px}
.room .vb{margin-top:14px;font-size:29px;line-height:1.35;color:var(--soft)}
.room .ft{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;font-size:12px;color:var(--mute);line-height:1.7}

/* ---------- end ---------- */
.en-k{margin-top:120px;font-size:24px;color:var(--accent)}
.en-t{margin:34px 0 0;font-weight:700;font-size:132px;line-height:.92;text-transform:uppercase}
.en-t em{font-style:normal;color:var(--accent)}
.svc{margin-top:64px;display:grid;gap:18px}
.svc div{display:flex;justify-content:space-between;align-items:center;padding:26px 28px;border:1px solid var(--line);background:rgba(14,11,23,.75);font-size:34px;font-weight:600}
.svc span{font-family:'Press Start 2P',monospace;font-size:14px;letter-spacing:.12em;color:var(--mute)}
.cta{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding:34px 36px;background:var(--accent);color:#0b0914}
.cta .a{font-weight:700;font-size:52px;text-transform:uppercase;line-height:1}
.cta .b{font-size:16px}
.en-foot{margin-top:28px;display:flex;justify-content:space-between;font-size:15px;color:var(--mute)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>

<script>
/* ======================= EDIT THIS FOR EACH ISSUE ======================= */
const ISSUE = {
  no: '01',
  dates: '6–19 Nov',
  // poster: drop the official poster (portrait, ~2:3) into posters/ with this file name. Missing → 8-bit placeholder.
  // vibe:   why this room suits this film. It's a suggestion – the footer reminds guests it plays in other rooms too.
  picks: [
    { title: 'Heartland', service: 'Netflix', when: 'New · 13 Nov', genre: 'Thriller', year: '2026',
      why: 'A Netflix original thriller led by Jessica Chastain. Lights off, phones face down.',
      room: 'Scarlett', poster: 'posters/heartland.jpg', sprite: 'house',
      vibe: 'Dark, moody and lit only by starlight. The perfect room to watch a thriller through your fingers.' },
    { title: 'Possible Love', service: 'Netflix', when: 'New · 6 Nov', genre: 'Korean cinema', year: '2026',
      why: 'The new film from Lee Chang-dong, the director of Burning. One for a slow, quiet night in.',
      room: 'Kai', poster: 'posters/possible-love.jpg', sprite: 'heart',
      vibe: 'Bonsai, stone and soft neutrals. A calm room for a film that takes its time.' },
    { title: 'Madden', service: 'Prime Video', when: 'New · 18 Nov', genre: 'Sports biopic', year: '2026',
      why: 'Nicolas Cage plays football legend John Madden. Bring the squad and pick sides.',
      room: 'Maximillion', poster: 'posters/madden.jpg', sprite: 'ball',
      vibe: 'Our biggest screen, home theatre sound and a racing sim for half-time. Built for game day.' },
    { title: 'Dune', service: 'HBO Max', when: 'Streaming now', genre: 'Sci-fi epic', year: '2021',
      why: 'Villeneuve’s desert epic was made for a big screen and a lot of bass.',
      room: 'Atlas', poster: 'posters/dune.jpg', sprite: 'dune',
      vibe: 'Warm whites and Greek-inspired details. A timeless room for an epic that feels ancient.' },
  ],
};
/* ======================================================================== */

// Rooms, from the live site (index.html). Kaeden is under renovation, so it isn't offered here.
const ROOMS = {
  Vale:        { tier:'Netflix room', c:'#E8436A', ink:'#0b0914', spec:'65" TV · 1–3 pax' },
  Scarlett:    { tier:'Netflix room', c:'#F2C21B', ink:'#0b0914', spec:'65" TV · 1–3 pax' },
  Kai:         { tier:'Deluxe room',  c:'#24B49A', ink:'#0b0914', spec:'75" TV · enhanced audio · 1–4 pax' },
  Bella:       { tier:'Deluxe room',  c:'#7A5BE0', ink:'#ffffff', spec:'75" TV · enhanced audio · 1–4 pax' },
  Atlas:       { tier:'Deluxe room',  c:'#E9E7EF', ink:'#0b0914', spec:'75" TV · enhanced audio · 1–5 pax' },
  Maximillion: { tier:'VIP room',     c:'#E0402F', ink:'#ffffff', spec:'85" TV · home theatre audio · 1–6 pax' },
};

// 8-bit placeholders shown until a poster file is added. '.' = empty, letters = palette.
const SPRITES = {
  heart: { pal:{a:'C',b:'#ffffff'}, rows:[
    '..aaa...aaa..','.aaaaa.aaaaa.','aabbaaaaaaaaa','abbaaaaaaaaaa','aaaaaaaaaaaaa','aaaaaaaaaaaaa',
    '.aaaaaaaaaaa.','..aaaaaaaaa..','...aaaaaaa...','....aaaaa....','.....aaa.....','......a......']},
  house: { pal:{a:'C',b:'#f4f1fb',c:'#0b0914',d:'#F2C21B',e:'#3a3350'}, rows:[
    '.......aa.......','......aaaa......','.....aaaaaa.....','....aaaaaaaa....','...aaaaaaaaaa...',
    '..aaaaaaaaaaaa..','...bbbbbbbbbb...','...bddbbbbddb...','...bddbbbbddb...','...bbbbccbbbbb..',
    '...bbbbccbbbb...','...bbbbccbbbb...','eeeeeeeeeeeeeeee','.e.e.e.e.e.e.e.e']},
  ball: { pal:{a:'#8a4b2a',b:'#f4f1fb',c:'C'}, rows:[
    '.....aaaaaa.....','...aaaaaaaaaa...','..aaaaaaaaaaaa..','.aaaaaaaaaaaaaa.','aabaaaaaaaaaabaa',
    'aabaabababaaabaa','aabaabbbbbaaabaa','aabaabababaaabaa','.aaaaaaaaaaaaaa.','..aaaaaaaaaaaa..',
    '...aaaaaaaaaa...','.....aaaaaa.....','................','cccccccccccccccc']},
  dune: { pal:{a:'#F2C21B',b:'C',c:'#b8462f',d:'#6e2a1f'}, rows:[
    '..........aaaa..','.........aaaaaa.','.........aaaaaa.','..........aaaa..','................',
    '................','.....bb..........','...bbbbbb.......','..bbbbbbbbb...bb','.bbbbbbbbbbbbbbb',
    'bbbbbccccccbbbbb','bbccccccccccccbb','cccccccddddccccc','ccdddddddddddddd']},
};

const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const LOGO = '../../menu/img/round2-logo.png';

function sprite(name, color){
  const s = SPRITES[name]; if(!s) return '';
  const w = Math.max(...s.rows.map(r => r.length)), px = Math.min(22, Math.floor(330 / s.rows.length));
  let cells = '';
  for(const r of s.rows) for(let i=0;i<w;i++){
    const k = r[i] || '.', col = k === '.' ? 'transparent' : (s.pal[k] === 'C' ? color : s.pal[k]);
    cells += `<i style="background:${col};width:${px}px;height:${px}px"></i>`;
  }
  return `<div class="sprite" style="grid-template-columns:repeat(${w},${px}px)">${cells}</div>`;
}
const frame = (c, ink, inner, glowPos='left:-300px;top:-260px', bg='') =>
  `<section class="slide" style="--c:${c};--cink:${ink}">${bg}<div class="glow" style="${glowPos}"></div>
   <div class="frame"></div><div class="vign"></div><div class="scan"></div><div class="in">${inner}</div></section>`;
const topBar = label => `<div class="top px"><img src="${LOGO}" alt="Round2"><div class="dash"></div><span>${esc(label)}</span></div>`;

function cover(){
  const rows = ISSUE.picks.map((p, i) => { const r = ROOMS[p.room];
    return `<div class="row${i===0?' on':''}" style="--rc:${r.c}"><span class="n px">0${i+1}</span>
      <span class="t">${esc(p.title)}</span><span class="sv px">${esc(p.service)}</span></div>`; }).join('');
  return frame('#F2C21B', '#0b0914', `${topBar('Issue ' + ISSUE.no)}
    <div class="cv-kicker px">Round2 Picks · ${esc(ISSUE.dates)}</div>
    <h1 class="cv-title">Now<span>Playing</span></h1>
    <div class="cv-sub">${ISSUE.picks.length} films we’d queue up this fortnight, each matched with the room that fits its vibe.</div>
    <div class="select"><div class="hd px"><span>Movie select</span><span class="blink">Swipe ▶</span></div>${rows}</div>
    <div class="cv-foot px"><span>Haji Lane · SG</span><span>round2.sg</span></div>`, 'right:-380px;top:-300px');
}

function pick(p, i){
  const r = ROOMS[p.room], n = ISSUE.picks.length;
  const hbo = /hbo/i.test(p.service);
  const note = hbo ? 'HBO Max in all Deluxe &amp; VIP rooms' : `${esc(p.service)} in every room`;
  const ts = p.title.length > 11 ? 66 : p.title.length > 7 ? 78 : 96;
  const img = p.poster ? `<img src="${esc(p.poster)}" alt="" onerror="this.remove()">` : '';
  const bg  = p.poster ? `<img class="bgimg" src="${esc(p.poster)}" alt="" onerror="this.remove()">` : '';
  return frame(r.c, r.ink, `${topBar('Round2 Picks')}
    <div class="pk-head"><div class="pk-num px">Pick ${i+1}/${n} · ${esc(p.when)}</div><div class="badge px">${esc(p.service)}</div></div>
    <div class="hero">
      <div class="poster">${sprite(p.sprite, r.c)}<div class="ph px">Poster<br>${esc(p.poster || '')}</div>${img}</div>
      <div class="side">
        <div class="genre px">${esc(p.genre)}</div>
        <h2 class="pk-title" style="--ts:${ts}px">${esc(p.title)}</h2>
        <div class="pk-meta px"><b>${esc(p.year)}</b> · on <b>${esc(p.service)}</b></div>
        <div class="pk-why">${esc(p.why)}</div>
      </div>
    </div>
    <div class="room">
      <div class="l px">▶ We’d watch it in</div>
      <div class="nm">${esc(p.room)}<small>${esc(r.tier)}</small></div>
      <div class="vb">${esc(p.vibe)}</div>
      <div class="ft px"><span>${esc(r.spec)}</span><span>${note}</span></div>
    </div>`,
    i % 2 ? 'right:-360px;top:120px' : 'left:-360px;top:120px', bg);
}

function end(){
  return frame('#F2C21B', '#0b0914', `${topBar('Continue?')}
    <div class="en-k px">Insert coin <span class="blink">_</span></div>
    <h2 class="en-t">Your room.<br><em>Your movie.</em></h2>
    <div class="svc">
      <div>Netflix + Prime Video <span>Every room</span></div>
      <div>HBO Max <span>Deluxe &amp; VIP</span></div>
      <div>PS4 / PS4 Pro <span>Every room</span></div>
    </div>
    <div class="cta"><div><div class="b px">Press start</div><div class="a" style="margin-top:12px">Book at round2.sg</div></div><div class="a">▶</div></div>
    <div class="en-foot px"><span>Private movie &amp; game rooms</span><span>Haji Lane</span></div>`, 'left:-260px;bottom:-420px');
}

document.getElementById('deck').innerHTML = [cover(), ...ISSUE.picks.map(pick), end()].join('');
if (location.search.includes('render')) document.body.classList.add('render');
</script>
</body>
</html>
