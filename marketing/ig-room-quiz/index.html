<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Which Room Are You</title>
<!--
  "Which Round2 room are you?" – Instagram carousel (1080 x 1350, 4:5).
  Marketing only; nothing here is used by the live site. Edit QUIZ below, then  python3 render.py
-->
<style>
@font-face{font-family:'Press Start 2P';src:url(fonts/PressStart2P-Regular.ttf)}
@font-face{font-family:'Chakra Petch';font-weight:500;src:url(fonts/ChakraPetch-Medium.ttf)}
@font-face{font-family:'Chakra Petch';font-weight:600;src:url(fonts/ChakraPetch-SemiBold.ttf)}
@font-face{font-family:'Chakra Petch';font-weight:700;src:url(fonts/ChakraPetch-Bold.ttf)}
:root{--bg:#06050a;--ink:#f4f1fb;--soft:#d6d0e3;--mute:#a79fbd;--line:rgba(244,241,251,.14);--accent:#F2C21B}
*{box-sizing:border-box}
body{margin:0;background:#1a1726;font-family:'Chakra Petch',sans-serif;color:var(--ink)}
.deck{display:flex;flex-wrap:wrap;gap:40px;padding:40px;justify-content:center}
body.render .deck{padding:0;gap:0}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--bg);flex:none;--c:var(--accent);--cink:#0b0914}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;background:var(--c);filter:blur(180px);opacity:.22}
.scan{position:absolute;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.016) 0 2px,transparent 2px 6px)}
.vign{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.7) 100%)}
.frame{position:absolute;inset:36px;border:1px solid var(--line);z-index:3}
.frame::before,.frame::after{content:"";position:absolute;width:34px;height:34px;border:4px solid var(--c)}
.frame::before{left:-4px;top:-4px;border-right:0;border-bottom:0}
.frame::after{right:-4px;bottom:-4px;border-left:0;border-top:0}
.px{font-family:'Press Start 2P',monospace;letter-spacing:.14em;text-transform:uppercase}
.in{position:absolute;inset:84px;z-index:6;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;font-size:17px;color:var(--mute)}
.top img{height:38px;display:block}
.dash{flex:1;height:10px;margin:0 22px;opacity:.5;background:repeating-linear-gradient(90deg,var(--c) 0 10px,transparent 10px 20px)}
.blink{animation:b 1.1s steps(2,start) infinite}@keyframes b{to{visibility:hidden}}
body.render .blink{animation:none}

/* cover – character select (soft) */
.cv-k{margin-top:46px;font-size:20px;color:var(--accent)}
.cv-t{margin:18px 0 0;font-weight:700;font-size:128px;line-height:.88;text-transform:uppercase;letter-spacing:-.015em}
.cv-t em{font-style:normal;color:var(--accent)}
.cv-s{margin-top:24px;font-size:31px;line-height:1.3;color:var(--soft)}
.cv-s b{font-weight:600;color:var(--ink)}
.grid{margin-top:34px;flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:18px}
.tile{position:relative;overflow:hidden;background:#0b0914;border-radius:26px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(6,5,10,0) 35%,color-mix(in srgb,var(--oc) 22%,rgba(6,5,10,.6)) 62%,rgba(6,5,10,.94) 100%)}
.tile .k{position:absolute;left:16px;top:16px;z-index:2;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:22px;background:var(--oc);color:var(--ok);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.tile .q{position:absolute;left:20px;right:18px;bottom:22px;z-index:2;font-size:26px;font-weight:600;line-height:1.18;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.tile.on{box-shadow:0 0 0 3px var(--oc),0 0 46px color-mix(in srgb,var(--oc) 45%,transparent)}
.tile .p1{display:none}
/* room card – character profile */
.hero{position:absolute;left:0;right:0;top:0;height:880px;overflow:hidden;z-index:1;background:#0b0914;
  -webkit-mask-image:linear-gradient(180deg,#000 62%,transparent 100%);mask-image:linear-gradient(180deg,#000 62%,transparent 100%)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.08)}
.hero .sprite{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%)}
.hero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(6,5,10,.78) 0%,rgba(6,5,10,0) 24%,rgba(6,5,10,0) 50%,rgba(6,5,10,.7) 80%,rgba(6,5,10,.9) 100%),
             linear-gradient(90deg,color-mix(in srgb,var(--c) 28%,transparent),transparent 45%)}
.slide .glow.card{opacity:.16}
.pick{margin-top:34px;align-self:flex-start;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 12px;background:rgba(6,5,10,.72);font-size:15px;color:var(--soft)}
.pick b{display:inline-block;padding:8px 11px;background:var(--c);color:var(--cink);font-weight:400}
.pick .tier{color:var(--c)}
.you{margin-top:auto;font-size:18px;color:var(--c);text-shadow:0 2px 12px #000}
.nm{margin:12px 0 0;font-weight:700;font-size:170px;line-height:.84;text-transform:uppercase;letter-spacing:-.015em;
  text-shadow:8px 8px 0 color-mix(in srgb,var(--c) 70%,transparent),0 10px 40px rgba(0,0,0,.6)}
.nm.long{font-size:124px}
.type{margin-top:22px;align-self:flex-start;padding:12px 20px 10px;font-size:40px;font-weight:700;line-height:1;text-transform:uppercase;
  background:var(--c);color:var(--cink);transform:skewX(-8deg);box-shadow:8px 8px 0 rgba(0,0,0,.5)}
.type span{display:inline-block;transform:skewX(8deg)}
.perks{margin-top:28px;display:grid}
.perk{display:flex;align-items:baseline;gap:20px;padding:15px 0;border-top:1px solid var(--line)}
.perk .n{font-size:15px;color:var(--c);flex:none}
.perk .t{font-size:31px;font-weight:600;line-height:1.2;color:var(--ink)}
.spec{margin-top:22px;display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.hud{position:absolute;right:84px;top:478px;z-index:7;width:390px;padding:20px 22px 18px;background:rgba(6,5,10,.8);border-top:4px solid var(--c);backdrop-filter:blur(6px)}
.hud .h{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.hud .h b{font-weight:400;color:var(--c)}
.stat{margin-top:16px}
.stat .lb{display:flex;justify-content:space-between;font-size:15px;color:var(--soft)}
.stat .bar{margin-top:9px;display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.stat .bar i{height:16px;background:rgba(244,241,251,.12)}
.stat .bar i.on{background:var(--c);box-shadow:0 0 10px color-mix(in srgb,var(--c) 60%,transparent)}
/* end */
.en-k{margin-top:54px;font-size:20px;color:var(--accent)}
.en-t{margin:18px 0 0;font-weight:700;font-size:118px;line-height:.9;text-transform:uppercase;letter-spacing:-.015em}
.en-t em{font-style:normal;color:var(--accent)}
.en-s{margin-top:24px;font-size:31px;line-height:1.32;color:var(--soft)}
.en-s b{font-weight:600;color:var(--ink)}
.roster{margin-top:36px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mate{display:flex;align-items:center;gap:18px;padding:12px;border-radius:22px;background:rgba(244,241,251,.05);border:1px solid var(--line)}
.mate .ph{position:relative;width:92px;height:92px;flex:none;border-radius:16px;overflow:hidden;background:#0b0914}
.mate .ph img{width:100%;height:100%;object-fit:cover;display:block}
.mate .ph .k{position:absolute;left:6px;top:6px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--oc);color:var(--ok)}
.mate .nm2{font-weight:700;font-size:34px;line-height:1;text-transform:uppercase;color:var(--ink)}
.mate .ty{margin-top:8px;font-size:22px;line-height:1.15;color:var(--oc)}
.cta{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding:30px 34px;background:var(--accent);color:#0b0914;border-radius:22px}
.cta .a{font-weight:700;font-size:46px;text-transform:uppercase;line-height:1}
.cta .b{font-size:15px}
/* soft corners to match the cover */
.chip{border-radius:20px;overflow:hidden}
.chip .k{border-radius:50%}
.hud{border-radius:18px}
.pick{border-radius:999px;padding-left:10px}
.pick b{border-radius:50%}
.cta{border-radius:22px}
.type{border-radius:6px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
/* ============================ EDIT HERE ============================ */
// One option per room. Rooms, colours and specs come from the live site. Kaeden is left out while it's under renovation.
const QUIZ = [
  { k:'A', room:'Vale',        night:'Looks fierce, but chats with everyone',      type:'The cold-girl extrovert', short:'Cold-girl extrovert',
    traits:['Looks unapproachable, chats with every Grab driver','Keeps sending you random reels','Cries at Pixar movies, then denies it'],
    stats:[['Social',9],['Drama',8],['Shy',2]], sprite:'bauhaus' },
  { k:'B', room:'Scarlett',    night:'Still awake at 2am, overthinking a text',   type:'The 2am overthinker', short:'2am overthinker',
    traits:['Replies “ok”, then overthinks for 3 hours','Supper at 1am, deep talks at 3am','Sends a Spotify link instead of saying how she feels'],
    stats:[['Night owl',10],['Overthinking',9],['Supper cravings',8]], sprite:'moon' },
  { k:'C', room:'Kai',         night:'Says “can” to plans, secretly wants to stay home',        type:'The calm introvert', short:'Calm introvert',
    traits:['Replies “can” to everything, and means it','The whole group’s free therapist','Social battery dies after one dinner'],
    stats:[['Chill',10],['Patience',9],['Social battery',3]], sprite:'bonsai' },
  { k:'D', room:'Bella',       night:'Looks innocent, planned the whole thing',     type:'The innocent-face mastermind', short:'Innocent mastermind',
    traits:['Plans the chaos, then acts surprised','Reads tarot “for fun”, takes it seriously','Rainy day plan: a book, kopi, no texts'],
    stats:[['Mischief',9],['Mystery',8],['Alibi',10]], sprite:'candle' },
  { k:'E', room:'Atlas',       night:'Main character, even at the hawker centre',   type:'The main-character dreamer', short:'Main character',
    traits:['Plans an overseas trip, never books','Takes 200 photos, posts none','Gets a crush after one conversation'],
    stats:[['Daydreaming',10],['Romance',9],['Posting',1]], sprite:'column' },
  { k:'F', room:'Maximillion', night:'Can’t lose, not even at Monopoly',      type:'The kiasu competitor', short:'Kiasu competitor',
    traits:['Plays Monopoly like his life depends on it','Says “one more round” at 3am','Loses, then asks for best of 3'],
    stats:[['Competitive',10],['Speed',9],['Losing well',1]], sprite:'flag' },
];
/* =================================================================== */

const ROOMS = {
  Vale:        { tier:'Netflix room', c:'#E8436A', ink:'#0b0914', spec:'65" TV · PS4 · 1–3 pax' },
  Scarlett:    { tier:'Netflix room', c:'#F2C21B', ink:'#0b0914', spec:'65" TV · PS4 · 1–3 pax' },
  Kai:         { tier:'Deluxe room',  c:'#24B49A', ink:'#0b0914', spec:'75" TV · PS4 Pro · 1–4 pax' },
  Bella:       { tier:'Deluxe room',  c:'#7A5BE0', ink:'#ffffff', spec:'75" TV · PS4 Pro · 1–4 pax' },
  Atlas:       { tier:'Deluxe room',  c:'#E9E7EF', ink:'#0b0914', spec:'75" TV · PS4 Pro · 1–5 pax' },
  Maximillion: { tier:'VIP room',     c:'#E0402F', ink:'#ffffff', spec:'85" TV · racing sim · 1–6 pax' },
};
const STREAM = { 'Netflix room':'Netflix + Prime', 'Deluxe room':'Netflix + Prime + HBO Max', 'VIP room':'Netflix + Prime + HBO Max' };

// Our own 8-bit sprites. '.' empty, 'C' = room colour.
const SPRITES = {
  bauhaus:{ pal:{a:'C',b:'#a79fbd',c:'#F2C21B'}, rows:[
    '..aaaa..........','.aaaaaa...bbbbbb','aaaaaaaa..bbbbbb','aaaaaaaa..bbbbbb','aaaaaaaa..bbbbbb','.aaaaaa...bbbbbb',
    '..aaaa..........','................','.......c........','......ccc.......','.....ccccc......','....ccccccc.....','...ccccccccc....']},
  moon:{ pal:{a:'C',b:'#f4f1fb'}, rows:[
    '....aaaa........','..aaaaa.......b.','.aaaa........bbb','.aaa..........b.','aaaa............','aaa......b......',
    'aaa.............','aaaa............','.aaa.........b..','.aaaa...........','..aaaaa.........','....aaaa........']},
  bonsai:{ pal:{a:'C',b:'#8a5a3a',c:'#6b6480'}, rows:[
    '.....aaaa.......','...aaaaaaaa.....','..aaaaaaaaaa.aa.','...aaaaaa..aaaa.','......b...aaaaa.','.....bb.....b...',
    '......bbb..bb...','........bbbb....','.........bb.....','.........b......','...cccccccccc...','....cccccccc....']},
  candle:{ pal:{a:'#F2C21B',b:'#ffffff',c:'#0b0914',d:'C',e:'#6b6480'}, rows:[
    '.......a........','......aaa.......','......aba.......','.......a........','.......c........','.....ddddd......',
    '.....ddddd......','.....ddddd......','.....ddddd......','.....ddddd......','...eeeeeeeee....','....eeeeeee.....']},
  column:{ pal:{a:'C',b:'#a79fbd'}, rows:[
    '.aaaaaaaaaaaaaa.','..aaaaaaaaaaaa..','...aaaaaaaaaa...','....abababab....','....abababab....','....abababab....',
    '....abababab....','....abababab....','....abababab....','...aaaaaaaaaa...','..aaaaaaaaaaaa..','.aaaaaaaaaaaaaa.']},
  flag:{ pal:{a:'C',b:'#0b0914',w:'#f4f1fb'}, rows:[
    'aa..............','aawwbbwwbbwwbb..','aawwbbwwbbwwbb..','aabbwwbbwwbbww..','aabbwwbbwwbbww..','aawwbbwwbbwwbb..',
    'aawwbbwwbbwwbb..','aabbwwbbwwbbww..','aabbwwbbwwbbww..','aa..............','aa..............','aa..............']},
};
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const LOGO = '../../menu/img/round2-logo.png';
function sprite(name, color, px=32){
  const s = SPRITES[name], w = Math.max(...s.rows.map(r => r.length)); let cells = '';
  for (const r of s.rows) for (let i = 0; i < w; i++){ const k = r[i] || '.';
    cells += `<i style="width:${px}px;height:${px}px;background:${k==='.'?'transparent':(s.pal[k]==='C'?color:s.pal[k])}"></i>`; }
  return `<div class="sprite" style="grid-template-columns:repeat(${w},${px}px)">${cells}</div>`;
}
const frame = (c, ink, inner, g='left:-300px;top:-260px', bg='') =>
  `<section class="slide" style="--c:${c};--cink:${ink}">${bg}<div class="glow" style="${g}"></div><div class="frame"></div><div class="vign"></div><div class="scan"></div><div class="in">${inner}</div></section>`;
const topBar = t => `<div class="top px"><img src="${LOGO}" alt="Round2"><div class="dash"></div><span>${esc(t)}</span></div>`;

function cover(){
  const tiles = QUIZ.map((q, i) => { const r = ROOMS[q.room];
    return `<div class="tile" style="--oc:${r.c};--ok:${r.ink}">
      <img src="photos/${q.room.toLowerCase()}.jpg" alt="" onerror="this.remove()">
      <span class="k px">${q.k}</span><span class="q">${esc(q.night)}</span></div>`; }).join('');
  return frame('#F2C21B','#0b0914', `${topBar('Round2 quiz')}
    <div class="cv-k px">Be honest <span class="blink">_</span></div>
    <h1 class="cv-t">Which one<br><em>is you?</em></h1>
    <div class="cv-s">Pick the one that sounds most like you, <b>then swipe to see your room ▶</b></div>
    <div class="grid">${tiles}</div>`, 'right:-380px;top:-300px');
}
function card(q, i){
  const r = ROOMS[q.room];
  const bg = `<div class="hero">${sprite(q.sprite, r.c)}<img src="photos/${q.room.toLowerCase()}.jpg" alt="" onerror="this.remove()"></div>
    <div class="hud"><div class="h px"><span>Stats</span></div>${q.stats.map(([l, v]) => `<div class="stat"><div class="lb px"><span>${esc(l)}</span><span>${v}/10</span></div><div class="bar">${Array.from({length:10}, (_, j) => `<i class="${j < v ? 'on' : ''}"></i>`).join('')}</div></div>`).join('')}</div>`;
  return frame(r.c, r.ink, `${topBar('Player ' + (i+1) + '/' + QUIZ.length)}
    <div class="pick px"><b>${q.k}</b><span class="tier">${esc(r.tier)}</span></div>
    <div class="you px">You are</div>
    <h2 class="nm${q.room.length > 7 ? ' long' : ''}">${esc(q.room)}</h2>
    <div class="type"><span>${esc(q.type)}</span></div>
    <div class="perks">${q.traits.map((t, j) => `<div class="perk"><span class="n px">0${j+1}</span><span class="t">${esc(t)}</span></div>`).join('')}</div>`,
    i % 2 ? 'right:-360px;bottom:-300px' : 'left:-360px;bottom:-300px', bg);
}
function end(){
  const roster = QUIZ.map(q => { const r = ROOMS[q.room]; return `<div class="mate" style="--oc:${r.c};--ok:${r.ink}">
    <div class="ph"><img src="photos/${q.room.toLowerCase()}.jpg" alt="" onerror="this.remove()"><span class="k px">${q.k}</span></div>
    <div><div class="nm2">${esc(q.room === 'Maximillion' ? 'Max' : q.room)}</div><div class="ty">${esc(q.short)}</div></div></div>`; }).join('');
  return frame('#F2C21B','#0b0914', `${topBar('Your move')}
    <div class="en-k px">Every group has one of each <span class="blink">_</span></div>
    <h2 class="en-t">Who’s who<br><em>in your group?</em></h2>
    <div class="en-s">Comment your letter, then <b>tag the friend who’s the Max of your group.</b></div>
    <div class="roster">${roster}</div>
    <div class="cta"><div><div class="b px">Bring the whole group</div><div class="a" style="margin-top:12px">Book at round2.sg</div></div><div class="a">▶</div></div>`, 'left:-260px;bottom:-420px');
}
document.getElementById('deck').innerHTML = [cover(), ...QUIZ.map(card), end()].join('');
if (location.search.includes('render')) document.body.classList.add('render');
</script>
</body>
</html>
