<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Which Room Are You</title>
<!--
  "Which Round2 room are you?" – Instagram carousel (1080 x 1350, 4:5).
  Marketing only; nothing here is used by the live site. Edit QUIZ below, then  python3 render.py
-->
<style>
@font-face{font-family:'Press Start 2P';src:url(fonts/PressStart2P-Regular.ttf)}
@font-face{font-family:'Chakra Petch';font-weight:500;src:url(fonts/ChakraPetch-Medium.ttf)}
@font-face{font-family:'Chakra Petch';font-weight:600;src:url(fonts/ChakraPetch-SemiBold.ttf)}
@font-face{font-family:'Chakra Petch';font-weight:700;src:url(fonts/ChakraPetch-Bold.ttf)}
:root{--bg:#06050a;--ink:#f4f1fb;--soft:#d6d0e3;--mute:#a79fbd;--line:rgba(244,241,251,.14);--accent:#F2C21B}
*{box-sizing:border-box}
body{margin:0;background:#1a1726;font-family:'Chakra Petch',sans-serif;color:var(--ink)}
.deck{display:flex;flex-wrap:wrap;gap:40px;padding:40px;justify-content:center}
body.render .deck{padding:0;gap:0}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--bg);flex:none;--c:var(--accent);--cink:#0b0914}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;background:var(--c);filter:blur(180px);opacity:.22}
.scan{position:absolute;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 5px)}
.vign{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.7) 100%)}
.frame{position:absolute;inset:36px;border:1px solid var(--line);z-index:3}
.frame::before,.frame::after{content:"";position:absolute;width:34px;height:34px;border:4px solid var(--c)}
.frame::before{left:-4px;top:-4px;border-right:0;border-bottom:0}
.frame::after{right:-4px;bottom:-4px;border-left:0;border-top:0}
.px{font-family:'Press Start 2P',monospace;letter-spacing:.14em;text-transform:uppercase}
.in{position:absolute;inset:84px;z-index:6;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;font-size:17px;color:var(--mute)}
.top img{height:38px;display:block}
.dash{flex:1;height:10px;margin:0 22px;opacity:.5;background:repeating-linear-gradient(90deg,var(--c) 0 10px,transparent 10px 20px)}
.blink{animation:b 1.1s steps(2,start) infinite}@keyframes b{to{visibility:hidden}}
body.render .blink{animation:none}

/* cover – character select */
.cv-k{margin-top:46px;display:flex;justify-content:space-between;font-size:20px;color:var(--accent)}
.cv-k span:last-child{color:var(--mute)}
.cv-t{margin:20px 0 0;font-weight:700;font-size:112px;line-height:.9;text-transform:uppercase}
.cv-t span{color:transparent;-webkit-text-stroke:3px var(--ink)}
.grid{margin-top:34px;flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:14px}
.tile{position:relative;overflow:hidden;border:2px solid rgba(244,241,251,.16);background:#0b0914}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.1) brightness(.8)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,5,10,.05) 25%,rgba(6,5,10,.92) 100%)}
.tile .k{position:absolute;left:14px;top:14px;z-index:2;width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--oc);color:var(--ok)}
.tile .q{position:absolute;left:18px;right:18px;bottom:16px;z-index:2;font-size:27px;font-weight:700;line-height:1.12}
.tile.on{border:4px solid var(--oc);box-shadow:0 0 40px color-mix(in srgb,var(--oc) 60%,transparent)}
.tile .p1{position:absolute;right:14px;top:14px;z-index:2;padding:9px 10px;font-size:13px;background:#06050a;color:var(--oc)}
.cv-f{margin-top:22px;display:flex;justify-content:space-between;font-size:16px;color:var(--mute)}
.cv-f b{font-weight:400;color:var(--accent)}
/* room card */
.rk{margin-top:52px;display:flex;justify-content:space-between;align-items:center}
.rk .l{font-size:18px;color:var(--mute)}
.rk .l b{display:inline-block;margin-left:12px;padding:10px 14px;background:var(--c);color:var(--cink);font-weight:400}
.rk .tier{font-size:15px;color:var(--c)}
.screen{position:relative;margin-top:28px;height:500px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  background:radial-gradient(80% 90% at 50% 100%,color-mix(in srgb,var(--c) 26%,transparent),transparent 70%),#0b0914}
.sprite{display:grid}
.screen{overflow:hidden}
.screen .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.screen .sprite{position:relative;z-index:1}
.screen .ptag{position:absolute;left:16px;top:16px;z-index:3;padding:8px 10px;background:rgba(6,5,10,.72);font-size:13px;color:var(--soft)}
.sprite i{display:block}
.you{margin-top:36px;font-size:18px;color:var(--c)}
.nm{margin:14px 0 0;font-weight:700;font-size:150px;line-height:.86;text-transform:uppercase;letter-spacing:-.01em;
  text-shadow:7px 7px 0 color-mix(in srgb,var(--c) 55%,transparent)}
.nm.long{font-size:116px}
.type{margin-top:22px;font-size:44px;font-weight:700;color:var(--c);text-transform:uppercase}
.traits{margin:18px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.traits li{position:relative;padding-left:34px;font-size:30px;line-height:1.25;color:var(--soft)}
.traits li::before{content:'▶';position:absolute;left:0;top:7px;font-size:18px;color:var(--c)}
.spec{margin-top:auto;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}

/* end */
.en-k{margin-top:120px;font-size:24px;color:var(--accent)}
.en-t{margin:30px 0 0;font-weight:700;font-size:128px;line-height:.92;text-transform:uppercase}
.en-t em{font-style:normal;color:var(--accent)}
.en-s{margin-top:34px;font-size:36px;line-height:1.35;color:var(--soft)}
.chips{margin-top:44px;display:flex;gap:12px}
.chips span{flex:1;height:84px;display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--oc);color:var(--ok)}
.cta{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding:34px 36px;background:var(--accent);color:#0b0914}
.cta .a{font-weight:700;font-size:50px;text-transform:uppercase;line-height:1}
.cta .b{font-size:16px}
.foot{margin-top:26px;display:flex;justify-content:space-between;font-size:15px;color:var(--mute)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
/* ============================ EDIT HERE ============================ */
// One option per room. Rooms, colours and specs come from the live site. Kaeden is left out while it's under renovation.
const QUIZ = [
  { k:'A', room:'Vale',        night:'Unbothered face, loudest in the group chat', type:'The cold-girl extrovert',
    traits:['Looks unapproachable, talks to everyone','Starts the karaoke and the drama','Secretly cries at Pixar movies'], sprite:'bauhaus' },
  { k:'B', room:'Scarlett',    night:'Most awake at 2am',                         type:'The night-owl overthinker',
    traits:['Sends songs instead of saying how she feels','Deep talks only after midnight','Believes in the stars, a little'], sprite:'moon' },
  { k:'C', room:'Kai',         night:'Leaves first, sleeps best',                 type:'The calm introvert',
    traits:['Replies “all good” and actually means it','Everyone’s unpaid therapist','Owns more plants than friends'], sprite:'bonsai' },
  { k:'D', room:'Bella',       night:'Looks innocent, planned everything',        type:'The sweet-looking menace',
    traits:['Started the whole plan, takes no blame','Reads tarot “for fun”, takes it seriously','Romanticises rainy days and old books'], sprite:'candle' },
  { k:'E', room:'Atlas',       night:'Romanticises literally everything',         type:'The main-character dreamer',
    traits:['Has a Pinterest board for a life not lived yet','Falls for people in one conversation','Takes 200 photos, posts none'], sprite:'column' },
  { k:'F', room:'Maximillion', night:'Turns everything into a competition',       type:'The sore winner',
    traits:['Turns Monopoly into a blood sport','Says “one more round” at 3am','Never admits a loss, asks for a rematch'], sprite:'flag' },
];
/* =================================================================== */

const ROOMS = {
  Vale:        { tier:'Netflix room', c:'#E8436A', ink:'#0b0914', spec:'65" TV · PS4 · 1–3 pax' },
  Scarlett:    { tier:'Netflix room', c:'#F2C21B', ink:'#0b0914', spec:'65" TV · PS4 · 1–3 pax' },
  Kai:         { tier:'Deluxe room',  c:'#24B49A', ink:'#0b0914', spec:'75" TV · PS4 Pro · 1–4 pax' },
  Bella:       { tier:'Deluxe room',  c:'#7A5BE0', ink:'#ffffff', spec:'75" TV · PS4 Pro · 1–4 pax' },
  Atlas:       { tier:'Deluxe room',  c:'#E9E7EF', ink:'#0b0914', spec:'75" TV · PS4 Pro · 1–5 pax' },
  Maximillion: { tier:'VIP room',     c:'#E0402F', ink:'#ffffff', spec:'85" TV · racing sim · 1–6 pax' },
};
const STREAM = { 'Netflix room':'Netflix + Prime', 'Deluxe room':'Netflix + Prime + HBO Max', 'VIP room':'Netflix + Prime + HBO Max' };

// Our own 8-bit sprites. '.' empty, 'C' = room colour.
const SPRITES = {
  bauhaus:{ pal:{a:'C',b:'#a79fbd',c:'#F2C21B'}, rows:[
    '..aaaa..........','.aaaaaa...bbbbbb','aaaaaaaa..bbbbbb','aaaaaaaa..bbbbbb','aaaaaaaa..bbbbbb','.aaaaaa...bbbbbb',
    '..aaaa..........','................','.......c........','......ccc.......','.....ccccc......','....ccccccc.....','...ccccccccc....']},
  moon:{ pal:{a:'C',b:'#f4f1fb'}, rows:[
    '....aaaa........','..aaaaa.......b.','.aaaa........bbb','.aaa..........b.','aaaa............','aaa......b......',
    'aaa.............','aaaa............','.aaa.........b..','.aaaa...........','..aaaaa.........','....aaaa........']},
  bonsai:{ pal:{a:'C',b:'#8a5a3a',c:'#6b6480'}, rows:[
    '.....aaaa.......','...aaaaaaaa.....','..aaaaaaaaaa.aa.','...aaaaaa..aaaa.','......b...aaaaa.','.....bb.....b...',
    '......bbb..bb...','........bbbb....','.........bb.....','.........b......','...cccccccccc...','....cccccccc....']},
  candle:{ pal:{a:'#F2C21B',b:'#ffffff',c:'#0b0914',d:'C',e:'#6b6480'}, rows:[
    '.......a........','......aaa.......','......aba.......','.......a........','.......c........','.....ddddd......',
    '.....ddddd......','.....ddddd......','.....ddddd......','.....ddddd......','...eeeeeeeee....','....eeeeeee.....']},
  column:{ pal:{a:'C',b:'#a79fbd'}, rows:[
    '.aaaaaaaaaaaaaa.','..aaaaaaaaaaaa..','...aaaaaaaaaa...','....abababab....','....abababab....','....abababab....',
    '....abababab....','....abababab....','....abababab....','...aaaaaaaaaa...','..aaaaaaaaaaaa..','.aaaaaaaaaaaaaa.']},
  flag:{ pal:{a:'C',b:'#0b0914',w:'#f4f1fb'}, rows:[
    'aa..............','aawwbbwwbbwwbb..','aawwbbwwbbwwbb..','aabbwwbbwwbbww..','aabbwwbbwwbbww..','aawwbbwwbbwwbb..',
    'aawwbbwwbbwwbb..','aabbwwbbwwbbww..','aabbwwbbwwbbww..','aa..............','aa..............','aa..............']},
};
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const LOGO = '../../menu/img/round2-logo.png';
function sprite(name, color, px=32){
  const s = SPRITES[name], w = Math.max(...s.rows.map(r => r.length)); let cells = '';
  for (const r of s.rows) for (let i = 0; i < w; i++){ const k = r[i] || '.';
    cells += `<i style="width:${px}px;height:${px}px;background:${k==='.'?'transparent':(s.pal[k]==='C'?color:s.pal[k])}"></i>`; }
  return `<div class="sprite" style="grid-template-columns:repeat(${w},${px}px)">${cells}</div>`;
}
const frame = (c, ink, inner, g='left:-300px;top:-260px') =>
  `<section class="slide" style="--c:${c};--cink:${ink}"><div class="glow" style="${g}"></div><div class="frame"></div><div class="vign"></div><div class="scan"></div><div class="in">${inner}</div></section>`;
const topBar = t => `<div class="top px"><img src="${LOGO}" alt="Round2"><div class="dash"></div><span>${esc(t)}</span></div>`;

function cover(){
  const tiles = QUIZ.map((q, i) => { const r = ROOMS[q.room];
    return `<div class="tile${i===0?' on':''}" style="--oc:${r.c};--ok:${r.ink}">
      <img src="photos/${q.room.toLowerCase()}.jpg" alt="" onerror="this.remove()">
      <span class="k px">${q.k}</span>${i===0?'<span class="p1 px blink">P1 ▼</span>':''}
      <span class="q">${esc(q.night)}</span></div>`; }).join('');
  return frame('#F2C21B','#0b0914', `${topBar('Choose your player')}
    <div class="cv-k px"><span>Round2 quiz</span><span>6 rooms · 1 you</span></div>
    <h1 class="cv-t">Which room<br><span>are you?</span></h1>
    <div class="grid">${tiles}</div>
    <div class="cv-f px"><span>Pick the one that’s SO you.</span><b>Swipe to reveal <span class="blink">▶</span></b></div>`, 'right:-380px;top:-300px');
}
function card(q, i){
  const r = ROOMS[q.room];
  return frame(r.c, r.ink, `${topBar('Player ' + (i+1) + '/' + QUIZ.length)}
    <div class="rk"><div class="l px">You picked<b>${q.k}</b></div><div class="tier px">${esc(r.tier)}</div></div>
    <div class="screen">${sprite(q.sprite, r.c)}<img class="photo" src="photos/${q.room.toLowerCase()}.jpg" alt="" onerror="this.remove()"><span class="ptag px">${esc(q.room)} room</span></div>
    <div class="you px">You are</div>
    <h2 class="nm${q.room.length > 7 ? ' long' : ''}">${esc(q.room)}</h2>
    <div class="type">${esc(q.type)}</div>
    <ul class="traits">${q.traits.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
    <div class="spec px"><span>${esc(r.spec)}</span><span>${esc(STREAM[r.tier])}</span></div>`,
    i % 2 ? 'right:-360px;top:60px' : 'left:-360px;top:60px');
}
function end(){
  const chips = QUIZ.map(q => { const r = ROOMS[q.room]; return `<span class="px" style="--oc:${r.c};--ok:${r.ink}">${q.k}</span>`; }).join('');
  return frame('#F2C21B','#0b0914', `${topBar('Your move')}
    <div class="en-k px">Player 2, press start <span class="blink">_</span></div>
    <h2 class="en-t">Drop your<br><em>letter.</em></h2>
    <div class="en-s">Comment A–F below, then tag the friend who is so obviously a Bella.</div>
    <div class="chips">${chips}</div>
    <div class="cta"><div><div class="b px">Play your room</div><div class="a" style="margin-top:12px">Book at round2.sg</div></div><div class="a">▶</div></div>
    <div class="foot px"><span>Private movie &amp; game rooms</span><span>Haji Lane</span></div>`, 'left:-260px;bottom:-420px');
}
document.getElementById('deck').innerHTML = [cover(), ...QUIZ.map(card), end()].join('');
if (location.search.includes('render')) document.body.classList.add('render');
</script>
</body>
</html>
